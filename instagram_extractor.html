<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram用户名提取器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
            background: linear-gradient(135deg, #eff6ff 0%, #bfdbfe 35%, #60a5fa 65%, #2563eb 100%);
            background-size: 200% 200%;
            animation: bgShift 18s ease infinite;
            min-height: 100vh;
            position: relative;
            color: #1e3a5f;
            overflow-x: hidden;
        }

        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* —— 弹幕层 —— */
        .danmaku-layer {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }

        .danmaku {
            position: absolute;
            white-space: nowrap;
            font-size: 15px;
            font-weight: 600;
            color: #1e40af;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            will-change: transform;
            animation: danmakuMove linear forwards;
        }

        @keyframes danmakuMove {
            from { transform: translateX(0); }
            to { transform: translateX(calc(-100vw - 100%)); }
        }

        .ad-left, .ad-right {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 400px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #1d4ed8;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ad-left { left: 20px; }
        .ad-right { right: 20px; }

        .ad-left:hover, .ad-right:hover {
            transform: translateY(-50%) scale(1.05);
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.2);
        }

        @media (max-width: 1400px) {
            .ad-left, .ad-right { display: none; }
        }

        .container {
            position: relative;
            z-index: 20;
            background: rgba(255, 255, 255, 0.48);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border-radius: 30px;
            padding: 40px;
            box-shadow:
                0 8px 32px rgba(37, 99, 235, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.75),
                inset 0 -1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.7);
            animation: containerSlideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes containerSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            color: #1e40af;
            font-size: 2.8em;
            font-weight: 800;
            margin-bottom: 15px;
            text-align: center;
            animation: fadeInDown 0.6s ease-out;
            letter-spacing: -0.5px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        h2 {
            color: #1e40af;
            font-size: 2em;
            font-weight: 700;
            margin: 60px 0 20px 0;
            text-align: center;
            animation: fadeInDown 0.6s ease-out 0.1s both;
            letter-spacing: -0.3px;
            position: relative;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, #3b82f6 0%, #93c5fd 100%);
            border-radius: 2px;
        }

        .intro {
            color: #334155;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
            text-align: center;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        .review-label {
            color: #2563eb;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 280px;
            font-size: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #1e293b;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            resize: vertical;
            animation: fadeInUp 0.6s ease-out 0.3s both;
        }

        textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        textarea::placeholder {
            color: #64748b;
            font-weight: 300;
        }

        button {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 600;
            margin: 20px 12px 0 0;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.9) 0%, rgba(59, 130, 246, 0.9) 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 28px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
            animation: fadeInUpButton 0.6s ease-out 0.4s forwards;
            transform: scale(1);
            letter-spacing: 0.3px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        button:hover {
            transform: scale(1.05) !important;
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.45);
        }

        button:active {
            transform: scale(0.98) !important;
        }

        button:active::before {
            width: 400px;
            height: 400px;
        }

        button:focus { outline: none; }

        .button-group button:nth-child(2n) {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.95) 0%, rgba(37, 99, 235, 0.9) 100%);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
            justify-content: center;
        }

        .button-group button {
            margin: 0;
        }

        .output-wrapper {
            margin-top: 30px;
            animation: fadeInUp 0.6s ease-out 0.5s both;
        }

        #output, #output3 {
            padding: 28px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 22px;
            font-size: 16px;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 120px;
            color: #1e293b;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #output:hover, #output3:hover {
            background: rgba(255, 255, 255, 0.42);
            border-color: rgba(255, 255, 255, 0.65);
        }

        .stats {
            margin-top: 18px;
            font-size: 15px;
            color: #334155;
            padding: 12px 0;
            animation: fadeIn 0.5s ease-out 0.6s both;
            font-weight: 500;
        }

        .stats-title {
            display: inline;
            font-weight: 600;
        }

        .duplicate-item {
            color: #dc2626;
            display: inline;
            margin-left: 10px;
            font-weight: 600;
        }

        .delimiter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 16px;
            margin-top: 18px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            font-size: 14px;
            color: #334155;
            animation: fadeInUp 0.6s ease-out 0.35s both;
        }

        .delimiter-label {
            font-weight: 600;
            color: #1e40af;
            margin-right: 4px;
        }

        .delimiter-option {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            gap: 5px;
        }

        .delimiter-option input {
            accent-color: #3b82f6;
            cursor: pointer;
        }

        .delimiter-custom-input {
            width: 110px;
            max-width: 40vw;
            padding: 6px 10px;
            font-size: 14px;
            font-family: ui-monospace, 'Cascadia Code', monospace;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.4);
            color: #1e293b;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .delimiter-custom-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            padding: 12px 22px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUpButton {
            from { opacity: 0; transform: translateY(20px) scale(1); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 768px) {
            body { padding: 20px 15px; }
            .container { padding: 30px 25px; }
            h1 { font-size: 2.2em; }
            h2 { font-size: 1.7em; }
            h2::after { width: 60px; height: 3px; }
            .button-group {
                flex-direction: column;
                align-items: stretch;
                margin-top: 20px;
            }
            button {
                width: 100%;
                margin: 0;
                padding: 14px 32px;
            }
            textarea {
                height: 220px;
                padding: 20px;
            }
            #output, #output3 {
                padding: 20px;
                min-height: 100px;
            }
            .danmaku { font-size: 13px; padding: 5px 12px; }
        }

        @media (max-width: 480px) {
            body { padding: 15px 10px; }
            .container {
                padding: 25px 20px;
                border-radius: 25px;
            }
            h1 { font-size: 2em; }
            h2 {
                font-size: 1.5em;
                margin: 40px 0 15px 0;
            }
            .intro { font-size: 15px; }
            textarea {
                height: 180px;
                font-size: 15px;
            }
            button {
                font-size: 15px;
                padding: 12px 28px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .container { padding: 40px 30px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .danmaku { display: none; }
            body { animation: none; }
        }
    </style>
</head>
<body>
    <div class="danmaku-layer" id="danmakuLayer" aria-hidden="true"></div>

    <div class="ad-left">广告位招租</div>
    <div class="ad-right">广告位招租</div>

    <div class="container">
        <h1>Instagram用户名提取器</h1>
        <p class="intro"><span class="review-label">最近评价：</span>我艹，这个网站巨他妈好用。</p>

        <textarea id="input" placeholder="支持两种格式：&#10;1. 链接格式：&lt;https://www.instagram.com/maryhvp19&gt;&#10;2. 模板格式：台灣自選C：&#10;   dailylife_recording&#10;   chime_bento"></textarea>
        <div class="delimiter-row" title="多个用户名合并为一行时使用的分隔符">
            <span class="delimiter-label">合并分隔符</span>
            <label class="delimiter-option"><input type="radio" name="usernameSep" value="*" checked> *</label>
            <label class="delimiter-option"><input type="radio" name="usernameSep" value="|"> |</label>
            <label class="delimiter-option"><input type="radio" name="usernameSep" value=","> ,</label>
            <label class="delimiter-option"><input type="radio" name="usernameSep" value="custom" id="usernameSepRadioCustom"> 自定义</label>
            <input type="text" id="usernameSepCustom" class="delimiter-custom-input" maxlength="32" placeholder="其他字符" autocomplete="off" aria-label="自定义分隔符" onfocus="document.getElementById('usernameSepRadioCustom').checked=true" oninput="document.getElementById('usernameSepRadioCustom').checked=true">
        </div>
        <div class="button-group">
            <button type="button" onclick="extract()">提取用户名</button>
            <button type="button" onclick="copyResult('output')">复制结果</button>
        </div>

        <div class="output-wrapper">
            <div id="output">结果显示在这里</div>
            <div id="stats1" class="stats"></div>
        </div>

        <h2>Tab转分隔符转换器</h2>
        <p class="intro">将制表符(Tab)分隔的数据转换为----分隔格式；可选在每行末尾追加网址</p>
        <textarea id="input3" placeholder="粘贴Tab分隔的数据...&#10;例：&#10;do__ant	PY8Z0rRj5u	JMQMKCADEIPF7QITYCMQMUDWHTZSKHIB	gd4dfwowh0zg@vnvmail.com	韩国"></textarea>
        <div class="delimiter-row" title="转换后每行末尾追加的网址">
            <span class="delimiter-label">追加网址</span>
            <label class="delimiter-option"><input type="radio" name="tabUrlSuffix" value="" id="tabUrlNone"> 无</label>
            <label class="delimiter-option"><input type="radio" name="tabUrlSuffix" value="https://17cce.com/" checked> https://17cce.com/</label>
            <label class="delimiter-option"><input type="radio" name="tabUrlSuffix" value="https://2fa.plus/"> https://2fa.plus/</label>
            <label class="delimiter-option"><input type="radio" name="tabUrlSuffix" value="custom" id="tabUrlRadioCustom"> 自定义</label>
            <input type="text" id="tabUrlCustom" class="delimiter-custom-input" maxlength="200" placeholder="输入网址" autocomplete="off" aria-label="自定义追加网址"
                onfocus="document.getElementById('tabUrlRadioCustom').checked=true"
                oninput="document.getElementById('tabUrlRadioCustom').checked=true">
        </div>
        <div class="button-group">
            <button type="button" onclick="convertTabToSeparator()">Tab转----</button>
            <button type="button" onclick="copyResult('output3')">复制结果</button>
        </div>
        <div class="output-wrapper">
            <div id="output3">转换结果显示在这里</div>
        </div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script>
        /* —— 弹幕 —— */
        const DANMAKU_TEXTS = [
            '作者真牛逼',
            '感谢作者',
            '作者太强了',
            '好用到哭',
            '作者人美心善',
            '永远的神',
            '作者 YYDS',
            '爱了爱了',
            '作者辛苦了',
            '这工具绝了',
            '作者牛批',
            '感谢大佬分享',
            '作者简直无敌',
            '好用！收藏了',
            '作者太会了',
            '跪谢作者',
            '作者带飞',
            '神中神',
            '作者永远年轻',
            '好用到飞起'
        ];

        (function initDanmaku() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const layer = document.getElementById('danmakuLayer');
            let idx = 0;
            const tracks = 8;
            let timer = null;

            function clearAll() {
                layer.innerHTML = '';
            }

            function spawn() {
                if (document.hidden) return;

                const text = DANMAKU_TEXTS[idx % DANMAKU_TEXTS.length];
                idx++;
                const el = document.createElement('div');
                el.className = 'danmaku';
                el.textContent = text;

                const track = Math.floor(Math.random() * tracks);
                const top = 8 + track * ((window.innerHeight - 80) / tracks);
                const duration = 10 + Math.random() * 8;

                el.style.top = top + 'px';
                el.style.left = '100vw';
                el.style.animationDuration = duration + 's';
                el.style.fontSize = (14 + Math.random() * 4) + 'px';
                el.style.opacity = String(0.75 + Math.random() * 0.25);

                layer.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
            }

            function scheduleNext() {
                clearTimeout(timer);
                timer = null;
                if (document.hidden) return;
                timer = setTimeout(() => {
                    spawn();
                    scheduleNext();
                }, 1400);
            }

            function start() {
                clearAll();
                spawn();
                scheduleNext();
            }

            function stop() {
                clearTimeout(timer);
                timer = null;
                clearAll();
            }

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) stop();
                else start();
            });

            start();
        })();

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => el.classList.remove('show'), 1600);
        }

        function getUsernameDelimiter() {
            const radio = document.querySelector('input[name="usernameSep"]:checked');
            if (!radio) return '*';
            if (radio.value === 'custom') {
                const custom = document.getElementById('usernameSepCustom').value;
                return custom !== '' ? custom : '*';
            }
            return radio.value;
        }

        async function copyResult(outputId) {
            let text = document.getElementById(outputId).innerText.trim();
            if (!text || text === '结果显示在这里' || text === '转换结果显示在这里' ||
                text === '请输入内容' || text.includes('未找到') || text.includes('格式不正确')) {
                toast('没有可复制的内容');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                toast('已复制');
            } catch {
                const temp = document.createElement('textarea');
                temp.value = text;
                temp.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(temp);
                temp.select();
                try {
                    document.execCommand('copy');
                    toast('已复制');
                } catch {
                    toast('复制失败');
                }
                document.body.removeChild(temp);
            }
        }

        function extract() {
            const input = document.getElementById('input').value.trim();
            if (!input) {
                document.getElementById('output').innerText = '请输入内容';
                document.getElementById('stats1').innerHTML = '';
                return;
            }

            const usernames = [];
            const hasInstagramLink = /instagram\.com/i.test(input);

            if (hasInstagramLink) {
                const regex = /(?:https?:\/\/)?(?:www\.)?instagram\.com\/([a-zA-Z0-9._]+)/gi;
                for (const match of input.matchAll(regex)) {
                    const name = match[1];
                    if (!/^(p|reel|reels|stories|explore|accounts|direct|tv)$/i.test(name)) {
                        usernames.push(name);
                    }
                }
            } else {
                input.split('\n').forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;

                    const hasChinese = /[\u4e00-\u9fa5]/.test(trimmed);
                    if (hasChinese) {
                        const colonIndex = trimmed.search(/[：:]/);
                        if (colonIndex !== -1) {
                            const afterColon = trimmed.substring(colonIndex + 1).trim();
                            if (afterColon) {
                                const firstPart = afterColon.split(/\s+/)[0].trim();
                                if (firstPart && /^[a-zA-Z0-9._]+$/.test(firstPart)) {
                                    usernames.push(firstPart);
                                }
                            }
                        }
                        return;
                    }

                    trimmed.split(/\s+/).forEach(part => {
                        const username = part.trim();
                        if (username && /^[a-zA-Z0-9._]+$/.test(username)) {
                            usernames.push(username);
                        }
                    });
                });
            }

            if (usernames.length === 0) {
                document.getElementById('output').innerText = '未找到Instagram用户名\n请检查是否包含 instagram.com/用户名 格式或模板格式';
                document.getElementById('stats1').innerHTML = '';
                return;
            }

            const countMap = {};
            usernames.forEach(u => { countMap[u] = (countMap[u] || 0) + 1; });

            const unique = [];
            const seen = new Set();
            for (const u of usernames) {
                if (!seen.has(u)) {
                    seen.add(u);
                    unique.push(u);
                }
            }

            const duplicates = [];
            for (const u in countMap) {
                if (countMap[u] > 1) {
                    duplicates.push({ username: u, count: countMap[u] });
                }
            }

            document.getElementById('output').innerText = unique.join(getUsernameDelimiter());

            let statsHtml = '<span class="stats-title">数量: ' + unique.length + '</span>';
            if (duplicates.length > 0) {
                statsHtml += '<span>，重复:';
                duplicates.forEach((dup, index) => {
                    if (index > 0) statsHtml += '，';
                    statsHtml += '<span class="duplicate-item">' + dup.username + ': ' + dup.count + '次</span>';
                });
                statsHtml += '</span>';
            }
            document.getElementById('stats1').innerHTML = statsHtml;
        }

        function getTabUrlSuffix() {
            const radio = document.querySelector('input[name="tabUrlSuffix"]:checked');
            if (!radio) return '';
            if (radio.value === 'custom') {
                return document.getElementById('tabUrlCustom').value.trim();
            }
            return radio.value;
        }

        function convertTabToSeparator() {
            const input = document.getElementById('input3').value.trim();
            if (!input) {
                document.getElementById('output3').innerText = '请输入内容';
                return;
            }

            const suffix = getTabUrlSuffix();

            const results = [];
            input.split('\n').forEach(line => {
                if (line.trim() === '') return;
                const converted = line.replace(/\t/g, '----');
                results.push(suffix ? converted + '----' + suffix : converted);
            });

            if (results.length === 0) {
                document.getElementById('output3').innerText = '格式不正确或没有有效数据';
                return;
            }

            document.getElementById('output3').innerText =
                results.join('\n\n') + '\n\n数量：' + results.length + '个';
        }
    </script>
</body>
</html>
